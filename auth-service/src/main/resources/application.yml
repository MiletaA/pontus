server:
  port: 8086

spring:
  application:
    name: auth-service
  
  # Explicitly disable CORS - handled by API Gateway
  web:
    cors:
      allowed-origins: []
  
  datasource:
    url: jdbc:postgresql://postgres-auth:5432/pontus_auth
    username: pontus_user
    password: pontus_pass
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://naming-server:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.pontus.auth: DEBUG
    org.springframework.web: DEBUG
