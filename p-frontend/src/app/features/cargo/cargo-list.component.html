<div class="container-fluid py-4">
  <div class="row mb-4">
    <div class="col">
      <h2><i class="bi bi-box-seam me-2"></i>Cargo Management</h2>
      <p class="text-muted">Track and manage cargo shipments</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="card mb-4">
    <div class="card-body">
      <form [formGroup]="filterForm">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Search</label>
            <input 
              type="text" 
              class="form-control" 
              formControlName="search"
              placeholder="Search by description, origin, destination..."
            >
          </div>
          <div class="col-md-2">
            <label class="form-label">Cargo Type</label>
            <select class="form-select" formControlName="cargoType">
              <option value="">All Types</option>
              @for (type of cargoTypes; track type) {
                <option [value]="type">{{ getTypeLabel(type) }}</option>
              }
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Customs Status</label>
            <select class="form-select" formControlName="customsStatus">
              <option value="">All Statuses</option>
              @for (status of customsStatuses; track status) {
                <option [value]="status">{{ getStatusLabel(status) }}</option>
              }
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label">Dangerous Cargo</label>
            <select class="form-select" formControlName="isDangerous">
              <option value="">All Cargo</option>
              <option value="true">Dangerous Only</option>
              <option value="false">Non-Dangerous Only</option>
            </select>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="button" class="btn btn-secondary w-100" (click)="filterForm.reset(); loadCargo()">
              <i class="bi bi-x-circle me-2"></i>Clear
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  @if (error) {
    <div class="alert alert-danger">
      <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
    </div>
  }

  @if (loading) {
    <div class="text-center py-5">
      <div class="loading-spinner"></div>
      <p class="mt-3">Loading cargo...</p>
    </div>
  }

  @if (!loading) {
    <app-data-table
      title="Cargo"
      [data]="cargoList"
      [columns]="columns"
      [pageInfo]="pageInfo"
      [showCreateButton]="true"
      emptyMessage="No cargo shipments in the system."
      (onPageChange)="onPageChange($event)"
      (onCreate)="onCreateCargo()"
      (onEdit)="onEditCargo($event)"
      (onDelete)="onDeleteCargo($event)">
    </app-data-table>
  }
</div>
