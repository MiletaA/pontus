<div class="container-fluid py-4">
  <!-- Header -->
  <div class="row mb-4">
    <div class="col">
      <h2>
        <i class="bi bi-ship me-2"></i>Vessels Management
      </h2>
      <p class="text-muted">Manage and monitor all vessels in the port system</p>
    </div>
  </div>

  <!-- Filters -->
  <div class="card mb-4">
    <div class="card-body">
      <form [formGroup]="filterForm">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Search</label>
            <input 
              type="text" 
              class="form-control" 
              formControlName="search"
              placeholder="Search by name, IMO, flag, type, status..."
            >
          </div>
          <div class="col-md-3">
            <label class="form-label">Status</label>
            <select class="form-select" formControlName="status">
              <option value="">All Statuses</option>
              @for (status of vesselStatuses; track status) {
                <option [value]="status">{{ getStatusLabel(status) }}</option>
              }
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Vessel Type</label>
            <select class="form-select" formControlName="vesselType">
              <option value="">All Types</option>
              @for (type of vesselTypes; track type) {
                <option [value]="type">{{ getTypeLabel(type) }}</option>
              }
            </select>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button type="button" class="btn btn-secondary w-100" (click)="filterForm.reset(); loadVessels()">
              <i class="bi bi-x-circle me-2"></i>Clear
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Loading State -->
  @if (loading) {
    <div class="text-center py-5">
      <div class="loading-spinner"></div>
      <p class="mt-3">Loading vessels...</p>
    </div>
  }

  <!-- Error State -->
  @if (error && !loading) {
    <div class="alert alert-danger" role="alert">
      <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
      <button type="button" class="btn-close float-end" aria-label="Close" (click)="error = ''"></button>
    </div>
  }

  <!-- Vessels Table -->
  @if (!loading && !error) {
    <app-data-table
      title="Vessels"
      [data]="vessels"
      [columns]="columns"
      [pageInfo]="pageInfo"
      [showCreateButton]="canCreate"
      emptyMessage="No vessels match your current filters."
      (onPageChange)="onPageChange($event)"
      (onCreate)="onCreateVessel()"
      (onEdit)="onEditVessel($event)"
      (onDelete)="onDeleteVessel($event)">
    </app-data-table>
  }

</div>
