<div class="container-fluid py-4">
      <div class="row mb-4">
        <div class="col">
          <h2><i class="bi bi-building me-2"></i>Docks Management</h2>
          <p class="text-muted">Manage port docks and berths</p>
        </div>
      </div>

      <!-- Filters -->
      <div class="card mb-4">
        <div class="card-body">
          <form [formGroup]="filterForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Search</label>
                <input 
                  type="text" 
                  class="form-control" 
                  formControlName="search"
                  placeholder="Search by dock name, description..."
                >
              </div>
              <div class="col-md-3">
                <label class="form-label">Status</label>
                <select class="form-select" formControlName="status">
                  <option value="">All Statuses</option>
                  <option value="true">Occupied</option>
                  <option value="false">Available</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Dangerous Cargo</label>
                <select class="form-select" formControlName="handlesDangerous">
                  <option value="">All Docks</option>
                  <option value="true">Can Handle Dangerous</option>
                  <option value="false">No Dangerous Cargo</option>
                </select>
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button type="button" class="btn btn-secondary w-100" (click)="filterForm.reset(); loadDocks()">
                  <i class="bi bi-x-circle me-2"></i>Clear
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      @if (error) {
        <div class="alert alert-danger">
          <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
        </div>
      }

      @if (loading) {
        <div class="text-center py-5">
          <div class="loading-spinner"></div>
          <p class="mt-3">Loading docks...</p>
        </div>
      }

      @if (!loading) {
        <app-data-table
          title="Docks"
          [data]="docks"
          [columns]="columns"
          [pageInfo]="pageInfo"
          [showCreateButton]="true"
          emptyMessage="No docks available in the system."
          (onPageChange)="onPageChange($event)"
          (onCreate)="onCreateDock()"
          (onEdit)="onEditDock($event)"
          (onDelete)="onDeleteDock($event)">
        </app-data-table>
      }
    </div>
