<div class="container-fluid py-4">
      <div class="row">
        <div class="col-lg-8 mx-auto">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h4 class="mb-0">
                <i class="bi bi-plus-circle me-2"></i>Create New Dock
              </h4>
            </div>
            
            <div class="card-body">
              @if (error) {
                <div class="alert alert-danger">
                  <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
                </div>
              }
              
              <form (ngSubmit)="onSubmit()" #dockForm="ngForm">
                <div class="row">
                  <!-- Basic Information -->
                  <div class="col-md-6">
                    <h6 class="text-muted mb-3">Basic Information</h6>
                    
                    <div class="mb-3">
                      <label for="name" class="form-label">Dock Name <span class="text-danger">*</span></label>
                      <input 
                        type="text" 
                        class="form-control" 
                        id="name"
                        name="name"
                        [(ngModel)]="dock.name"
                        required
                        placeholder="Enter dock name"
                      >
                    </div>
                    
                    <div class="mb-3">
                      <label for="maxLength" class="form-label">Maximum Length (meters) <span class="text-danger">*</span></label>
                      <input 
                        type="number" 
                        class="form-control" 
                        id="maxLength"
                        name="maxLength"
                        [(ngModel)]="dock.maxLength"
                        required
                        min="1"
                        step="0.01"
                        placeholder="0.00"
                      >
                    </div>
                    
                    <div class="mb-3">
                      <div class="form-check">
                        <input 
                          type="checkbox" 
                          class="form-check-input" 
                          id="handlesDangerous"
                          name="handlesDangerous"
                          [(ngModel)]="dock.handlesDangerous"
                        >
                        <label class="form-check-label" for="handlesDangerous">
                          Can Handle Dangerous Cargo
                        </label>
                      </div>
                    </div>
                  </div>
                  
                  <!-- Status & Assignment -->
                  <div class="col-md-6">
                    <h6 class="text-muted mb-3">Status & Assignment</h6>
                    
                    <div class="mb-3">
                      <div class="form-check">
                        <input 
                          type="checkbox" 
                          class="form-check-input" 
                          id="isOccupied"
                          name="isOccupied"
                          [(ngModel)]="dock.isOccupied"
                        >
                        <label class="form-check-label" for="isOccupied">
                          Currently Occupied
                        </label>
                      </div>
                    </div>
                    
                    <div class="mb-3">
                      <label for="assignedVesselId" class="form-label">Assigned Vessel ID</label>
                      <input 
                        type="number" 
                        class="form-control" 
                        id="assignedVesselId"
                        name="assignedVesselId"
                        [(ngModel)]="dock.assignedVesselId"
                        placeholder="Enter vessel ID (optional)"
                      >
                    </div>
                    
                    <div class="mb-3">
                      <label for="scheduledFrom" class="form-label">Scheduled From</label>
                      <input 
                        type="datetime-local" 
                        class="form-control" 
                        id="scheduledFrom"
                        name="scheduledFrom"
                        [(ngModel)]="dock.scheduledFrom"
                      >
                    </div>
                    
                    <div class="mb-3">
                      <label for="scheduledTo" class="form-label">Scheduled To</label>
                      <input 
                        type="datetime-local" 
                        class="form-control" 
                        id="scheduledTo"
                        name="scheduledTo"
                        [(ngModel)]="dock.scheduledTo"
                      >
                    </div>
                  </div>
                </div>
                
                <div class="row">
                  <div class="col-12">
                    <div class="mb-3">
                      <label for="description" class="form-label">Description</label>
                      <textarea 
                        class="form-control" 
                        id="description"
                        name="description"
                        [(ngModel)]="dock.description"
                        rows="3"
                        placeholder="Enter dock description (optional)"
                      ></textarea>
                    </div>
                  </div>
                </div>
                
                <div class="d-flex justify-content-between mt-4">
                  <button type="button" class="btn btn-secondary" (click)="onCancel()">
                    <i class="bi bi-x-circle me-2"></i>Cancel
                  </button>
                  <button type="submit" class="btn btn-primary" [disabled]="loading || dockForm.invalid">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                    <i *ngIf="!loading" class="bi bi-check-circle me-2"></i>
                    {{ loading ? 'Creating...' : 'Create Dock' }}
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
