<div class="container-fluid py-4">
      <!-- Header -->
      <div class="row mb-4">
        <div class="col">
          <h2>
            <i class="bi bi-people me-2"></i>Crew Management
          </h2>
          <p class="text-muted">Manage crew members and their assignments</p>
        </div>
      </div>

      <!-- Filters -->
      <div class="card mb-4">
        <div class="card-body">
          <form [formGroup]="filterForm">
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Search</label>
                <input 
                  type="text" 
                  class="form-control" 
                  formControlName="search"
                  placeholder="Search by name, position, nationality..."
                >
              </div>
              <div class="col-md-3">
                <label class="form-label">Position</label>
                <select class="form-select" formControlName="position">
                  <option value="">All Positions</option>
                  @for (position of crewPositions; track position) {
                    <option [value]="position">{{ getPositionLabel(position) }}</option>
                  }
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Nationality</label>
                <select class="form-select" formControlName="nationality">
                  <option value="">All Nationalities</option>
                  @for (nationality of nationalities; track nationality) {
                    <option [value]="nationality">{{ nationality }}</option>
                  }
                </select>
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button type="button" class="btn btn-secondary w-100" (click)="filterForm.reset(); loadCrew()">
                  <i class="bi bi-x-circle me-2"></i>Clear
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Data Table -->
      <div class="text-center py-5" *ngIf="loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3">Loading crew members...</p>
      </div>

      <app-data-table
        *ngIf="!loading"
        title="Crew Members"
        [data]="crewList"
        [columns]="columns"
        [pageInfo]="pageInfo"
        [showCreateButton]="true"
        emptyMessage="No crew members in the system."
        (onPageChange)="onPageChange($event)"
        (onCreate)="onCreateCrew()"
        (onEdit)="onEditCrew($event)"
        (onDelete)="onDeleteCrew($event)">
      </app-data-table>
    </div>
