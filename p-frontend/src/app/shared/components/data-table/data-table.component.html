<div class="card shadow-sm">
      <div class="card-header bg-white border-bottom">
        <div class="row align-items-center">
          <div class="col">
            <h5 class="card-title mb-0">{{ title }}</h5>
            <small class="text-muted" *ngIf="pageInfo">
              Showing {{ getStartRecord() }} to {{ getEndRecord() }} of {{ pageInfo.totalElements }} entries
            </small>
          </div>
          <div class="col-auto">
            <button class="btn btn-primary btn-sm" (click)="onCreate.emit()" *ngIf="showCreateButton">
              <i class="bi bi-plus-circle me-1"></i>Add New
            </button>
          </div>
        </div>
      </div>
      
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th *ngFor="let column of columns" 
                    [class.sortable]="column.sortable"
                    (click)="onSort.emit(column)">
                  {{ column.label }}
                  <i class="bi bi-arrow-up-down ms-1" *ngIf="column.sortable"></i>
                </th>
                <th width="120" *ngIf="showActions">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of (data || []); trackBy: trackByFn">
                <td *ngFor="let column of columns">
                  <ng-container *ngIf="column.template; else defaultCell">
                    <ng-container *ngTemplateOutlet="column.template; context: { $implicit: item }"></ng-container>
                  </ng-container>
                  <ng-template #defaultCell>
                    {{ getColumnValue(item, column.key) }}
                  </ng-template>
                </td>
                <td *ngIf="showActions">
                  <div class="btn-group btn-group-sm">
                    <button class="btn btn-outline-primary" (click)="onEdit.emit(item)" title="Edit">
                      <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-outline-danger" (click)="onDelete.emit(item)" title="Delete">
                      <i class="bi bi-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>
              <tr *ngIf="data && data.length === 0">
                <td [attr.colspan]="columns.length + (showActions ? 1 : 0)" class="text-center py-4">
                  <div class="text-muted">
                    <i class="bi bi-inbox display-4 d-block mb-2"></i>
                    <h6>No {{ title.toLowerCase() }} found</h6>
                    <p class="mb-0">{{ emptyMessage || 'No data available' }}</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
      
      <div class="card-footer bg-white border-top" *ngIf="pageInfo && pageInfo.totalPages > 1">
        <nav aria-label="Table pagination">
          <ul class="pagination pagination-sm justify-content-center mb-0">
            <li class="page-item" [class.disabled]="pageInfo.page === 0">
              <button class="page-link" (click)="onPageChange.emit(0)" [disabled]="pageInfo.page === 0">
                <i class="bi bi-chevron-double-left"></i>
              </button>
            </li>
            <li class="page-item" [class.disabled]="pageInfo.page === 0">
              <button class="page-link" (click)="onPageChange.emit(pageInfo.page - 1)" [disabled]="pageInfo.page === 0">
                <i class="bi bi-chevron-left"></i>
              </button>
            </li>
            
            <li class="page-item" 
                *ngFor="let page of getVisiblePages()" 
                [class.active]="page === pageInfo.page">
              <button class="page-link" 
                      (click)="onPageChange.emit(page)"
                      [class.bg-primary]="page === pageInfo.page"
                      [class.text-white]="page === pageInfo.page">
                {{ page + 1 }}
              </button>
            </li>
            
            <li class="page-item" [class.disabled]="pageInfo.page >= pageInfo.totalPages - 1">
              <button class="page-link" (click)="onPageChange.emit(pageInfo.page + 1)" 
                      [disabled]="pageInfo.page >= pageInfo.totalPages - 1">
                <i class="bi bi-chevron-right"></i>
              </button>
            </li>
            <li class="page-item" [class.disabled]="pageInfo.page >= pageInfo.totalPages - 1">
              <button class="page-link" (click)="onPageChange.emit(pageInfo.totalPages - 1)" 
                      [disabled]="pageInfo.page >= pageInfo.totalPages - 1">
                <i class="bi bi-chevron-double-right"></i>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
