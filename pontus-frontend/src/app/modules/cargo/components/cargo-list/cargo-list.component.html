<div class="cargo-list-container">
  <!-- Header -->
  <div class="page-header">
    <div class="row align-items-center">
      <div class="col">
        <h2 class="h3 mb-0">
          <i class="fas fa-boxes me-2"></i>
          Cargo Management
        </h2>
        <p class="text-muted mb-0">Track and manage cargo shipments</p>
      </div>
      <div class="col-auto">
        <div class="d-flex gap-2">
          <button 
            class="btn btn-outline-primary"
            (click)="refreshData()"
            [disabled]="loading"
          >
            <i class="fas fa-sync-alt me-2" [class.fa-spin]="loading"></i>
            Refresh
          </button>
          <button 
            *ngIf="canCreate()"
            class="btn btn-primary"
            (click)="createNewCargo()"
          >
            <i class="fas fa-plus me-2"></i>
            New Cargo
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Filters -->
  <app-cargo-filters (filtersChanged)="onFiltersChanged($event)"></app-cargo-filters>

  <!-- Statistics -->
  <div class="row mb-4" *ngIf="!loading">
    <div class="col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-primary">
          <i class="fas fa-boxes"></i>
        </div>
        <div class="stat-content">
          <div class="stat-number">{{ cargo.length }}</div>
          <div class="stat-label">Total Cargo</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-success">
          <i class="fas fa-check-circle"></i>
        </div>
        <div class="stat-content">
          <div class="stat-number">{{ getClearedCargoCount() }}</div>
          <div class="stat-label">Cleared</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-warning">
          <i class="fas fa-clock"></i>
        </div>
        <div class="stat-content">
          <div class="stat-number">{{ getPendingCargoCount() }}</div>
          <div class="stat-label">Pending</div>
        </div>
      </div>
    </div>
    <div class="col-md-3">
      <div class="stat-card">
        <div class="stat-icon bg-danger">
          <i class="fas fa-exclamation-triangle"></i>
        </div>
        <div class="stat-content">
          <div class="stat-number">{{ getDangerousCargoCount() }}</div>
          <div class="stat-label">Dangerous</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="alert alert-danger">
    <i class="fas fa-exclamation-triangle me-2"></i>
    {{ error }}
  </div>

  <!-- Results Count -->
  <div *ngIf="!loading && !error" class="results-info mb-3">
    <small class="text-muted">
      Showing {{ filteredCargo.length }} of {{ cargo.length }} cargo items
    </small>
  </div>

  <!-- Cargo Table -->
  <div class="table-card">
    <app-cargo-table
      [cargo]="filteredCargo"
      [loading]="loading"
      (cargoDeleted)="onCargoDeleted($event)"
    ></app-cargo-table>
  </div>
</div>
