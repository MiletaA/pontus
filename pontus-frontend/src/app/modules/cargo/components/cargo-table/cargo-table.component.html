<div class="table-responsive">
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Vessel ID</th>
        <th>Description</th>
        <th>Weight</th>
        <th>Origin</th>
        <th>Status</th>
        <th>Dangerous</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="loading">
        <td colspan="8" class="text-center py-4">
          <i class="fas fa-spinner fa-spin me-2"></i>
          Loading cargo...
        </td>
      </tr>
      <tr *ngIf="!loading && cargo.length === 0">
        <td colspan="8" class="text-center py-4 text-muted">
          <i class="fas fa-inbox me-2"></i>
          No cargo found
        </td>
      </tr>
      <tr *ngFor="let cargoItem of cargo">
        <td>{{ cargoItem.id }}</td>
        <td>{{ cargoItem.vesselId }}</td>
        <td>{{ cargoItem.description }}</td>
        <td>{{ cargoItem.weight }} kg</td>
        <td>{{ cargoItem.origin || '-' }}</td>
        <td>
          <app-cargo-status-badge [cargo]="cargoItem"></app-cargo-status-badge>
        </td>
        <td>
          <span *ngIf="cargoItem.isDangerous" class="badge bg-danger">
            <i class="fas fa-exclamation-triangle me-1"></i>
            Dangerous
          </span>
          <span *ngIf="!cargoItem.isDangerous" class="text-muted">-</span>
        </td>
        <td>
          <div class="btn-group btn-group-sm" role="group">
            <button
              *ngIf="canUpdate()"
              type="button"
              class="btn btn-outline-primary"
              (click)="editCargo(cargoItem)"
              title="Edit cargo">
              <i class="fas fa-edit"></i>
            </button>
            <button
              *ngIf="canDelete()"
              type="button"
              class="btn btn-outline-danger"
              (click)="deleteCargo(cargoItem)"
              title="Delete cargo">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
