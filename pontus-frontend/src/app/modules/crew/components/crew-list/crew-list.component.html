<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
          <i class="fas fa-users me-2"></i>
          Crew Management
        </h2>
        <button
          *ngIf="canCreate()"
          type="button"
          class="btn btn-primary"
          (click)="createNewCrewMember()">
          <i class="fas fa-plus me-1"></i>
          Add Crew Member
        </button>
      </div>

      <app-crew-filters (filtersChanged)="onFiltersChanged($event)"></app-crew-filters>

      <div class="row mb-3">
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <h5 class="card-title">{{ crewMembers.length }}</h5>
              <p class="card-text text-muted">Total Crew Members</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <h5 class="card-title">{{ filteredCrewMembers.length }}</h5>
              <p class="card-text text-muted">Filtered Results</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <h5 class="card-title">{{ getAssignedCrewCount() }}</h5>
              <p class="card-text text-muted">Assigned to Vessels</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <h5 class="card-title">{{ getUnassignedCrewCount() }}</h5>
              <p class="card-text text-muted">Available</p>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        {{ error }}
        <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="refreshData()">
          <i class="fas fa-redo me-1"></i>
          Retry
        </button>
      </div>

      <div class="card">
        <div class="card-header">
          <h5 class="card-title mb-0">
            <i class="fas fa-list me-2"></i>
            Crew Members
          </h5>
        </div>
        <div class="card-body p-0">
          <app-crew-table
            [crewMembers]="filteredCrewMembers"
            [loading]="loading"
            (crewMemberDeleted)="onCrewMemberDeleted($event)">
          </app-crew-table>
        </div>
      </div>
    </div>
  </div>
</div>
