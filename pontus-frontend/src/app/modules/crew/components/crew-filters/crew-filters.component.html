<div class="filters-container">
  <form [formGroup]="filterForm" class="row g-3">
    <div class="col-md-4">
      <label for="search" class="form-label">Search</label>
      <input
        type="text"
        class="form-control"
        id="search"
        formControlName="search"
        placeholder="Search by name, passport...">
    </div>

    <div class="col-md-3">
      <label for="nationality" class="form-label">Nationality</label>
      <select class="form-select" id="nationality" formControlName="nationality">
        <option value="">All nationalities</option>
        <option *ngFor="let nationality of nationalities" [value]="nationality">{{ nationality }}</option>
      </select>
    </div>

    <div class="col-md-3">
      <label for="rank" class="form-label">Rank</label>
      <select class="form-select" id="rank" formControlName="rank">
        <option value="">All ranks</option>
        <option *ngFor="let rank of ranks" [value]="rank">{{ rank }}</option>
      </select>
    </div>

    <div class="col-md-2">
      <label for="vesselId" class="form-label">Vessel ID</label>
      <input
        type="number"
        class="form-control"
        id="vesselId"
        formControlName="vesselId"
        placeholder="Filter by vessel">
    </div>

    <div class="col-12">
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="clearFilters()">
        <i class="fas fa-times me-1"></i>
        Clear Filters
      </button>
    </div>
  </form>
</div>
