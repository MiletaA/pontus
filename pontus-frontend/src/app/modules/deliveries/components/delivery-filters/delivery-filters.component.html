<div class="filters-container">
  <form [formGroup]="filterForm" class="row g-3">
    <div class="col-md-4">
      <label for="search" class="form-label">Search</label>
      <input
        type="text"
        class="form-control"
        id="search"
        formControlName="search"
        placeholder="Search by destination, recipient...">
    </div>

    <div class="col-md-3">
      <label for="status" class="form-label">Status</label>
      <select class="form-select" id="status" formControlName="status">
        <option value="">All statuses</option>
        <option *ngFor="let status of deliveryStatuses" [value]="status">{{ status }}</option>
      </select>
    </div>

    <div class="col-md-3">
      <label for="cargoId" class="form-label">Cargo ID</label>
      <input
        type="number"
        class="form-control"
        id="cargoId"
        formControlName="cargoId"
        placeholder="Filter by cargo">
    </div>

    <div class="col-12">
      <button type="button" class="btn btn-outline-secondary btn-sm" (click)="clearFilters()">
        <i class="fas fa-times me-1"></i>
        Clear Filters
      </button>
    </div>
  </form>
</div>
