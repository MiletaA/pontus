<div class="container-fluid">
  <div class="row">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
          <i class="fas fa-truck me-2"></i>
          Delivery Management
        </h2>
        <button
          *ngIf="canCreate()"
          type="button"
          class="btn btn-primary"
          (click)="createNewDelivery()">
          <i class="fas fa-plus me-1"></i>
          Add Delivery
        </button>
      </div>

      <app-delivery-filters (filtersChanged)="onFiltersChanged($event)"></app-delivery-filters>

      <div class="row mb-3">
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <h5 class="card-title">{{ deliveries.length }}</h5>
              <p class="card-text text-muted">Total Deliveries</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <h5 class="card-title">{{ filteredDeliveries.length }}</h5>
              <p class="card-text text-muted">Filtered Results</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <h5 class="card-title">{{ getPendingDeliveriesCount() }}</h5>
              <p class="card-text text-muted">Pending</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card text-center">
            <div class="card-body">
              <h5 class="card-title">{{ getDeliveredDeliveriesCount() }}</h5>
              <p class="card-text text-muted">Delivered</p>
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="error" class="alert alert-danger" role="alert">
        <i class="fas fa-exclamation-triangle me-2"></i>
        {{ error }}
        <button type="button" class="btn btn-sm btn-outline-danger ms-2" (click)="refreshData()">
          <i class="fas fa-redo me-1"></i>
          Retry
        </button>
      </div>

      <div class="card">
        <div class="card-header">
          <h5 class="card-title mb-0">
            <i class="fas fa-list me-2"></i>
            Deliveries
          </h5>
        </div>
        <div class="card-body p-0">
          <app-delivery-table
            [deliveries]="filteredDeliveries"
            [loading]="loading"
            (deliveryDeleted)="onDeliveryDeleted($event)">
          </app-delivery-table>
        </div>
      </div>
    </div>
  </div>
</div>
