<div class="recent-activity-card">
  <div class="card">
    <div class="card-header">
      <h5 class="mb-0">
        <i class="fas fa-history me-2"></i>
        Recent Activity
      </h5>
    </div>
    <div class="card-body p-0">
      <div *ngIf="loading" class="text-center py-4">
        <div class="spinner-border spinner-border-sm text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
      
      <div *ngIf="!loading && activities.length === 0" class="text-center py-4 text-muted">
        <i class="fas fa-inbox fa-2x mb-3"></i>
        <p class="mb-0">No recent activity</p>
      </div>

      <div *ngIf="!loading && activities.length > 0" class="activity-list">
        <div 
          *ngFor="let activity of activities" 
          class="activity-item"
        >
          <div class="activity-icon" [class]="'bg-' + activity.color">
            <i [class]="activity.icon"></i>
          </div>
          <div class="activity-content">
            <div class="activity-header">
              <span class="activity-action">{{ activity.action }}</span>
              <span class="activity-time">{{ getTimeAgo(activity.timestamp) }}</span>
            </div>
            <div class="activity-description">
              {{ activity.description }}
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="card-footer text-center" *ngIf="activities.length > 0">
      <a href="#" class="text-decoration-none">
        <small>View all activity</small>
      </a>
    </div>
  </div>
</div>
