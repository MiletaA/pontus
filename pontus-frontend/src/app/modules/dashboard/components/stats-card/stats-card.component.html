<div class="stats-card" [class]="'border-' + color" [routerLink]="routerLink" [style.cursor]="routerLink ? 'pointer' : 'default'">
  <div class="card h-100">
    <div class="card-body d-flex align-items-center">
      <div class="flex-shrink-0">
        <div class="stats-icon" [class]="'bg-' + color">
          <i [class]="icon"></i>
        </div>
      </div>
      <div class="flex-grow-1 ms-3">
        <div class="stats-value" [class]="'text-' + color">{{ value }}</div>
        <div class="stats-title">{{ title }}</div>
      </div>
      <div class="flex-shrink-0" *ngIf="routerLink">
        <i class="fas fa-chevron-right text-muted"></i>
      </div>
    </div>
  </div>
</div>
