<div class="dashboard-container">
  <!-- Header -->
  <div class="dashboard-header">
    <div class="row align-items-center">
      <div class="col">
        <h1 class="h3 mb-0">
          <i class="fas fa-tachometer-alt me-2"></i>
          Dashboard
        </h1>
        <p class="text-muted mb-0" *ngIf="currentUser$ | async as user">
          Welcome back, {{ user.firstName }} {{ user.lastName }}
        </p>
      </div>
      <div class="col-auto">
        <button 
          class="btn btn-outline-primary"
          (click)="refreshData()"
          [disabled]="loading"
        >
          <i class="fas fa-sync-alt me-2" [class.fa-spin]="loading"></i>
          Refresh
        </button>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-3 text-muted">Loading dashboard data...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !loading" class="alert alert-danger">
    <i class="fas fa-exclamation-triangle me-2"></i>
    {{ error }}
  </div>

  <!-- Dashboard Content -->
  <div *ngIf="!loading && !error">
    <!-- Vessels Section -->
    <div class="section-header">
      <h4>
        <i class="fas fa-ship me-2"></i>
        Vessels
      </h4>
    </div>
    <div class="row mb-4">
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="Total Vessels"
          [value]="stats.vessels.total"
          icon="fas fa-ship"
          color="primary"
          [routerLink]="['/vessels']"
        ></app-stats-card>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="Berthed"
          [value]="stats.vessels.berthed"
          icon="fas fa-anchor"
          color="success"
        ></app-stats-card>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="Underway"
          [value]="stats.vessels.underway"
          icon="fas fa-route"
          color="info"
        ></app-stats-card>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="Scheduled"
          [value]="stats.vessels.scheduled"
          icon="fas fa-calendar-alt"
          color="warning"
        ></app-stats-card>
      </div>
    </div>

    <!-- Docks Section -->
    <div class="section-header">
      <h4>
        <i class="fas fa-warehouse me-2"></i>
        Docks
      </h4>
    </div>
    <div class="row mb-4">
      <div class="col-lg-4 col-md-6 mb-3">
        <app-stats-card
          title="Total Docks"
          [value]="stats.docks.total"
          icon="fas fa-warehouse"
          color="primary"
          [routerLink]="['/docks']"
        ></app-stats-card>
      </div>
      <div class="col-lg-4 col-md-6 mb-3">
        <app-stats-card
          title="Occupied"
          [value]="stats.docks.occupied"
          icon="fas fa-times-circle"
          color="danger"
        ></app-stats-card>
      </div>
      <div class="col-lg-4 col-md-6 mb-3">
        <app-stats-card
          title="Available"
          [value]="stats.docks.available"
          icon="fas fa-check-circle"
          color="success"
        ></app-stats-card>
      </div>
    </div>

    <!-- Cargo Section -->
    <div class="section-header">
      <h4>
        <i class="fas fa-boxes me-2"></i>
        Cargo
      </h4>
    </div>
    <div class="row mb-4">
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="Total Cargo"
          [value]="stats.cargo.total"
          icon="fas fa-boxes"
          color="primary"
          [routerLink]="['/cargo']"
        ></app-stats-card>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="Pending Customs"
          [value]="stats.cargo.pending"
          icon="fas fa-clock"
          color="warning"
        ></app-stats-card>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="Cleared"
          [value]="stats.cargo.cleared"
          icon="fas fa-check"
          color="success"
        ></app-stats-card>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="Dangerous Cargo"
          [value]="stats.cargo.dangerous"
          icon="fas fa-exclamation-triangle"
          color="danger"
        ></app-stats-card>
      </div>
    </div>

    <!-- Crew Section -->
    <div class="section-header">
      <h4>
        <i class="fas fa-users me-2"></i>
        Crew
      </h4>
    </div>
    <div class="row mb-4">
      <div class="col-lg-4 col-md-6 mb-3">
        <app-stats-card
          title="Total Crew"
          [value]="stats.crew.total"
          icon="fas fa-users"
          color="primary"
          [routerLink]="['/crew']"
        ></app-stats-card>
      </div>
      <div class="col-lg-4 col-md-6 mb-3">
        <app-stats-card
          title="Assigned"
          [value]="stats.crew.assigned"
          icon="fas fa-user-check"
          color="success"
        ></app-stats-card>
      </div>
      <div class="col-lg-4 col-md-6 mb-3">
        <app-stats-card
          title="Unassigned"
          [value]="stats.crew.unassigned"
          icon="fas fa-user-times"
          color="warning"
        ></app-stats-card>
      </div>
    </div>

    <!-- Deliveries Section -->
    <div class="section-header">
      <h4>
        <i class="fas fa-truck me-2"></i>
        Deliveries
      </h4>
    </div>
    <div class="row mb-4">
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="Total Deliveries"
          [value]="stats.deliveries.total"
          icon="fas fa-truck"
          color="primary"
          [routerLink]="['/deliveries']"
        ></app-stats-card>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="Scheduled"
          [value]="stats.deliveries.scheduled"
          icon="fas fa-calendar-check"
          color="secondary"
        ></app-stats-card>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="In Transit"
          [value]="stats.deliveries.inTransit"
          icon="fas fa-shipping-fast"
          color="info"
        ></app-stats-card>
      </div>
      <div class="col-lg-3 col-md-6 mb-3">
        <app-stats-card
          title="Delivered"
          [value]="stats.deliveries.delivered"
          icon="fas fa-check-circle"
          color="success"
        ></app-stats-card>
      </div>
    </div>

    <!-- Recent Activity -->
    <div class="section-header">
      <h4>
        <i class="fas fa-history me-2"></i>
        Recent Activity
      </h4>
    </div>
    <app-recent-activity></app-recent-activity>
  </div>
</div>
