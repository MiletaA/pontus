<div class="dock-filters">
  <form [formGroup]="filterForm">
    <div class="row g-3">
      <!-- Search -->
      <div class="col-md-4">
        <label for="search" class="form-label">Search</label>
        <input
          type="text"
          id="search"
          class="form-control"
          formControlName="search"
          placeholder="Search by name or description"
        >
      </div>

      <!-- Occupation Status -->
      <div class="col-md-2">
        <label for="isOccupied" class="form-label">Status</label>
        <select id="isOccupied" class="form-select" formControlName="isOccupied">
          <option value="">All</option>
          <option value="false">Available</option>
          <option value="true">Occupied</option>
        </select>
      </div>

      <!-- Dangerous Cargo -->
      <div class="col-md-2">
        <label for="handlesDangerous" class="form-label">Dangerous Cargo</label>
        <select id="handlesDangerous" class="form-select" formControlName="handlesDangerous">
          <option value="">All</option>
          <option value="true">Yes</option>
          <option value="false">No</option>
        </select>
      </div>

      <!-- Min Length -->
      <div class="col-md-2">
        <label for="minLength" class="form-label">Min Length (m)</label>
        <input
          type="number"
          id="minLength"
          class="form-control"
          formControlName="minLength"
          placeholder="Min"
          step="0.01"
        >
      </div>

      <!-- Max Length -->
      <div class="col-md-2">
        <label for="maxLength" class="form-label">Max Length (m)</label>
        <input
          type="number"
          id="maxLength"
          class="form-control"
          formControlName="maxLength"
          placeholder="Max"
          step="0.01"
        >
      </div>
    </div>

    <!-- Clear Filters Button -->
    <div class="row mt-3">
      <div class="col-12">
        <button
          type="button"
          class="btn btn-outline-secondary btn-sm"
          (click)="clearFilters()"
        >
          <i class="fas fa-times me-1"></i>
          Clear Filters
        </button>
      </div>
    </div>
  </form>
</div>
