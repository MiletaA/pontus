<div class="dock-table-container">
  <div class="table-responsive">
    <table class="table table-hover">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Max Length</th>
          <th>Status</th>
          <th>Dangerous Cargo</th>
          <th>Assigned Vessel</th>
          <th>Description</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="loading">
          <td colspan="7" class="text-center py-4">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 mb-0 text-muted">Loading docks...</p>
          </td>
        </tr>
        
        <tr *ngIf="!loading && docks.length === 0">
          <td colspan="7" class="text-center py-4 text-muted">
            <i class="fas fa-warehouse fa-2x mb-3"></i>
            <p class="mb-0">No docks found</p>
          </td>
        </tr>

        <tr *ngFor="let dock of docks; trackBy: trackByDockId" class="dock-row">
          <td>
            <strong>{{ dock.name }}</strong>
          </td>
          <td>
            <span class="badge bg-info">{{ dock.maxLength }}m</span>
          </td>
          <td>
            <app-dock-status-badge [dock]="dock"></app-dock-status-badge>
          </td>
          <td>
            <span *ngIf="dock.handlesDangerous" class="badge bg-warning">
              <i class="fas fa-exclamation-triangle me-1"></i>
              Yes
            </span>
            <span *ngIf="!dock.handlesDangerous" class="badge bg-secondary">
              <i class="fas fa-times me-1"></i>
              No
            </span>
          </td>
          <td>
            <span *ngIf="dock.assignedVesselId" class="text-primary">
              <i class="fas fa-ship me-1"></i>
              Vessel #{{ dock.assignedVesselId }}
            </span>
            <span *ngIf="!dock.assignedVesselId" class="text-muted">
              <i class="fas fa-minus me-1"></i>
              None
            </span>
          </td>
          <td>
            <span *ngIf="dock.description" class="text-truncate" [title]="dock.description">
              {{ dock.description }}
            </span>
            <span *ngIf="!dock.description" class="text-muted">-</span>
          </td>
          <td class="text-center">
            <div class="btn-group btn-group-sm" role="group">
              <!-- Assign/Unassign Vessel -->
              <button
                *ngIf="!dock.isOccupied && canUpdate()"
                type="button"
                class="btn btn-outline-success"
                (click)="assignVessel(dock)"
                title="Assign Vessel"
              >
                <i class="fas fa-plus"></i>
              </button>
              
              <button
                *ngIf="dock.isOccupied && canUpdate()"
                type="button"
                class="btn btn-outline-warning"
                (click)="unassignVessel(dock)"
                title="Unassign Vessel"
              >
                <i class="fas fa-minus"></i>
              </button>

              <!-- Edit -->
              <button
                *ngIf="canUpdate()"
                type="button"
                class="btn btn-outline-primary"
                (click)="editDock(dock)"
                title="Edit Dock"
              >
                <i class="fas fa-edit"></i>
              </button>

              <!-- Delete -->
              <button
                *ngIf="canDelete()"
                type="button"
                class="btn btn-outline-danger"
                (click)="deleteDock(dock)"
                title="Delete Dock"
              >
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
