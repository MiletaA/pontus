server:
  port: 8081

spring:
  application:
    name: vessel-service
  
  # Explicitly disable CORS - handled by API Gateway
  web:
    cors:
      allowed-origins: []
  
  datasource:
    url: jdbc:postgresql://postgres-vessel:5432/pontus_vessel
    username: pontus_user
    password: pontus_pass
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://naming-server:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.pontus.vessel: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
